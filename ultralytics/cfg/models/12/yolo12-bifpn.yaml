# Ultralytics YOLOv12-BiFPN model
# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants (n, s, m, l, x)
  n: [0.33, 0.25, 1024] 
  s: [0.33, 0.50, 1024]  
  m: [0.67, 0.75, 768]   
  l: [1.00, 1.00, 512]   
  x: [1.00, 1.25, 512]   

# YOLOv12 Backbone (Standard)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6-Area Attention
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8-Area Attention

# BiFPN Neck (Modified)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 9
  
  # Ensure P4 (layer 6) matches P5's upsampled channels (typically 512->512 is fine, but explicit Conv is safer)
  - [6, 1, Conv, [512, 1, 1]] # 10 Reduce/Align P4 channels
  - [[-1, -2], 1, BiFPN_Add, []] # 11 Fuse P5-up + P4 (Weighted Sum)

  - [-1, 2, C3k2, [512, False]] # 12 Refine

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [4, 1, Conv, [512, 1, 1]] # 14 Project P3 (from backbone) to 512 channels
  - [[-1, -2], 1, BiFPN_Add, []] # 15 Fuse P4-up + P3 (Weighted Sum)

  - [-1, 2, C3k2, [256, False]] # 16 Refine (Output P3)

  - [-1, 1, Conv, [256, 3, 2]] # 17 Downsample
  - [[-1, 12], 1, BiFPN_Add, []] # 18 Fuse P3-down + P4 (Weighted Sum)
  
  - [-1, 2, C3k2, [512, False]] # 19 Refine (Output P4)

  - [-1, 1, Conv, [512, 3, 2]] # 20 Downsample
  - [[-1, 9], 1, BiFPN_Add, []] # 21 Fuse P4-down + P5 (Weighted Sum)

  - [-1, 2, C3k2, [1024, True]] # 22 Refine (Output P5)

  # Detect Head
  - [[16, 19, 22], 1, Detect, [nc]]