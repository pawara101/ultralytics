nc: 80
scales:
  n: [0.33, 0.25, 1024] 

backbone:
  # ... (Standard Backbone P1 to P5) ...
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4-P3 (256 channels)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6-P4 (512 channels)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]  # 8-P5 (1024 channels)
  - [-1, 1, SPPF, [1024, 5]]   # 9-P5 (1024 channels)

head:
  # ==========================================
  # STEP 1: LATERAL PROJECTIONS (Force all to 256ch)
  # ==========================================
  - [4, 1, Conv, [256, 1, 1]]  # 10 - Project P3 to 256 (1x1 Conv)
  - [6, 1, Conv, [256, 1, 1]]  # 11 - Project P4 to 256 (1x1 Conv)
  - [9, 1, Conv, [256, 1, 1]]  # 12 - Project P5 to 256 (1x1 Conv)

  # ==========================================
  # STEP 2: BiFPN BLOCK (Now inputs 10, 11, 12 are all 256ch)
  # ==========================================
  
  # --- Top-Down Path ---
  # Fuse P4 (Layer 11) + Resize(P5 (Layer 12))
  - [12, 1, nn.Upsample, [None, 2, 'nearest']] # 13 - Resize P5
  - [[11, 13], 1, BiFPN_Concat, [1]]           # 14 - Fuse P4_projected + P5_resized
  - [-1, 3, C2f, [256]]                        # 15 - Process P4_td

  # Fuse P3 (Layer 10) + Resize(P4_td (Layer 15))
  - [15, 1, nn.Upsample, [None, 2, 'nearest']] # 16 - Resize P4_td
  - [[10, 16], 1, BiFPN_Concat, [1]]           # 17 - Fuse P3_projected + P4_td_resized
  - [-1, 3, C2f, [256]]                        # 18 - Process P3_out (Small Object Output)

  # --- Bottom-Up Path ---
  # Fuse P4_in(11) + P4_td(15) + Downsample(P3_out(18))
  - [18, 1, Conv, [256, 3, 2]]                 # 19 - Downsample P3_out
  - [[11, 15, 19], 1, BiFPN_Concat, [1]]       # 20 - Fuse P4_in + P4_td + P3_down
  - [-1, 3, C2f, [256]]                        # 21 - Process P4_out (Medium Object Output)

  # Fuse P5_in(12) + Downsample(P4_out(21))
  # (Note: Strictly BiFPN fuses P5_in + P5_td + P4_out, but P5_td is usually just P5_in)
  - [21, 1, Conv, [256, 3, 2]]                 # 22 - Downsample P4_out
  - [[12, 22], 1, BiFPN_Concat, [1]]           # 23 - Fuse P5_in + P4_out_down
  - [-1, 3, C2f, [256]]                        # 24 - Process P5_out (Large Object Output)

  # ==========================================
  # STEP 3: DETECT HEAD
  # ==========================================
  - [[18, 21, 24], 1, Detect, [nc]]            # Inputs are P3_out, P4_out, P5_out